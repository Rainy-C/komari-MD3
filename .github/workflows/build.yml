name: Build MD3 theme
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        with:
          name: komari-MD3-installable
          path: release/*
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: test-results/
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: komari-MD3-installable
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
